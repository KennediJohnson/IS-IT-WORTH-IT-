<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06080c">
  <meta name="description" content="Find out if a purchase is actually worth your money.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Worth It?">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <title>Worth the Hype?</title>
</head>
<body>
  <div id="bg" aria-hidden="true"></div>
  <div id="splash" role="button" tabindex="0" aria-label="Tap to open Worth the Hype?">
    <div>
      <div class="splash-orb"></div>
      <div class="splash-logo">Worth the<br>Hype?</div>
      <div class="splash-sub" id="splash-sub"></div>
      <div class="splash-tap" id="splash-tap">Tap to enter ✨</div>
    </div>
  </div>
  <header class="top">
    <div class="brand">Worth the Hype<span>?</span></div>
    <button class="avatar" data-action="profile" aria-label="Your profile and settings">🙂</button>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabs" aria-label="Main">
    <button data-tab="home"><span class="ti">🏠</span><span>Home</span></button>
    <button data-tab="test"><span class="ti">🧪</span><span>Regret Test</span></button>
    <button data-tab="items"><span class="ti">💖</span><span>My Stuff</span></button>
    <button data-tab="spend"><span class="ti">📊</span><span>Spending</span></button>
    <button data-tab="community"><span class="ti">💬</span><span>Community</span></button>
  </nav>

  <div id="sheet-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="themes.js"></script>
  <script src="app.js"></script>
</body>
</html>
